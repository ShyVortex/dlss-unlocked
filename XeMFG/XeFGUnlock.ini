; XeFGUnlock.ini — config for XeFGUnlock.asi (OptiScaler ASI plugin).
; Place next to XeFGUnlock.asi in OptiScaler's plugins/ folder
; (needs Plugins/LoadAsiPlugins=true in OptiScaler.ini).
; Stock OptiScaler is required; no OptiScaler rebuild or file edit is needed.
; Mirrors the OptiScaler XeFG settings from commit bb1619ec ("XeFG: unlock
; multi frame generation and fix >2X pacing").
; A restart applies any change here.

[XeFG]
; true or false - Default is true
UnlockMFG=true

; int 1..5 - Default is 3. 4 and 5 ( 5x and 6x FG) do work, but have issues with pacing unless you enable V-Sync.
MaxInterpolatedFrames=3

; true or false - Default is true
ExtraPacing=true

; true or false - Default is true (logging disabled)
DisableLogging=true
